name: Pair Extraordinaire helper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-coauthored-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create bot-authored coauthor commit
        shell: bash
        run: |
          set -euo pipefail
          branch="agent/pair-extraordinaire-20260813"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' '# Pair Extraordinaire' '' 'This marker verifies a co-authored contribution created entirely inside this repository.' > PAIR_EXTRAORDINAIRE.md
          rm .github/workflows/pair-extraordinaire.yml
          git add PAIR_EXTRAORDINAIRE.md .github/workflows/pair-extraordinaire.yml
          git commit -m "Add co-authored achievement marker" -m "Co-authored-by: naoyamd <19279668+naoyamd@users.noreply.github.com>"
          git push --set-upstream origin "$branch"
